name: ai_chat_app
description: AI Chat Client - Multi-model chat
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.0
  shared_preferences: ^2.2.0
  image_picker: ^1.0.0
  uuid: ^4.0.0
  crypto: ^3.0.0
  flutter_markdown: ^0.7.3
  gal: ^2.3.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: "assets/fonts/Inter.ttf"
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: JetBrainsMono
      fonts:
        - asset: "assets/fonts/JetBrainsMono.ttf"
